<!DOCTYPE html>
<html>
<head>
    <title>Simple Table</title>
</head>
<body>

    <h2>Student Table</h2>

    <table border="1">
        <tr>
            <th>Name</th>
            <th>Age</th>
            <th>Class</th>
        </tr>
        <tr>
            <td>Rahul</td>
            <td>18</td>
            <td>12</td>
        </tr>
        <tr>
            <td>Anjali</td>
            <td>17</td>
            <td>11</td>
        </tr>
    </table>

</body>
</html>
