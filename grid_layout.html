<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Grid</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        .container {
            display: grid;

            grid-template-areas:
                "header header header"
                "sidebar main main"
                "footer footer footer";

            grid-template-rows: 60px 1fr 60px;
            grid-template-columns: 200px 1fr 1fr;

            height: 90vh;
            width: 100vw;
        }

        .header {
            grid-area: header;
            background: #333;
            color: white;
            display: flex;
            align-items: center;
            padding: 0 20px;
        }

        .sidebar {
            grid-area: sidebar;
            background: #f4f4f4;
            padding: 20px;
        }

        .sidebar h3 {
            margin-top: 0;
        }

        .sidebar ul {
            list-style: none;
            padding: 0;
        }

        .sidebar li {
            padding: 10px 0;
        }

        .main {
            grid-area: main;
            padding: 20px;

            display: grid;
            grid-template-columns: repeat(
                auto-fill,
                minmax(200px, 1fr)
            );

            gap: 20px;
            overflow-y: auto;
        }

        .product {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: center;
        }

        .product img {
            width: 100%;
            height: auto;
        }

        .product h3 {
            margin: 10px 0 5px;
        }

        .product p {
            margin: 5px 0;
        }

        .footer {
            grid-area: footer;
            background: #333;
            color: white;
            text-align: center;
            line-height: 60px;
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- Header -->
        <header class="header">
            <h2>My Online Store</h2>
        </header>

        <!-- Sidebar -->
        <aside class="sidebar">
            <h3>Categories</h3>

            <ul>
                <li>Electronics</li>
                <li>Clothing</li>
                <li>Books</li>
                <li>Accessories</li>
            </ul>
        </aside>

        <!-- Main Content -->
        <main class="main">

            <div class="product">
                <img src="black-panther.jpg" alt="Black Panther">
                <h3>Black Panther</h3>
                <p>₹999</p>
            </div>

            <div class="product">
                <img src="product2.jpg" alt="Product 2">
                <h3>Product 2</h3>
                <p>₹799</p>
            </div>

            <div class="product">
                <img src="product3.jpg" alt="Product 3">
                <h3>Product 3</h3>
                <p>₹599</p>
            </div>

            <div class="product">
                <img src="product4.jpg" alt="Product 4">
                <h3>Product 4</h3>
                <p>₹1,299</p>
            </div>

        </main>

        <!-- Footer -->
        <footer class="footer">
            © 2026 My Online Store
        </footer>

    </div>

</body>
</html>
